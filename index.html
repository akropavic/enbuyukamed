<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CioTV</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --primary: #10b981; /* Neon Yeşil */
            --text-main: #fafafa;
            --text-dim: #a1a1aa;
            
            /* Safe Area Değişkenleri */
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            /* Sağa sola kaymayı kesinlikle engeller */
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER - Safe area uyumlu */
        header {
            padding: calc(var(--sat) + 16px) 20px 16px 20px;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand span {
            color: var(--primary);
        }

        .live-badge {
            background-color: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* VİDEO ALANI */
        .video-container {
            width: 100%;
            background: #000;
            /* Ekranın sağından solundan taşmaması için safe area */
            padding-left: var(--sal);
            padding-right: var(--sar);
        }

        .video-js {
            width: 100%;
        }

        .vjs-default-skin .vjs-play-progress,
        .vjs-default-skin .vjs-volume-level {
            background-color: var(--primary) !important;
        }

        /* BİLGİ ÇUBUĞU (Videonun hemen altı) */
        .info-bar {
            padding: 16px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-left: calc(var(--sal) + 20px);
            padding-right: calc(var(--sar) + 20px);
        }

        .now-playing-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        #nowPlayingText {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }

        /* KANAL LİSTESİ */
        .channels-wrapper {
            flex: 1;
            padding: 16px 20px;
            padding-bottom: calc(var(--sab) + 20px); /* Alttaki iPhone çubuğu için boşluk */
            padding-left: calc(var(--sal) + 20px);
            padding-right: calc(var(--sar) + 20px);
        }

        .channels-wrapper h3 {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Kanallar arası boşluk */
        }

        .channel-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-main);
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-btn:active {
            transform: scale(0.97);
            background: rgba(255,255,255,0.1);
        }

        .channel-btn.active {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--primary);
            color: var(--text-main);
        }

        .channel-btn.active .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        /* PC İÇİN UFAK BİR DOKUNUŞ (Geniş ekranlarda çok yayılmasın diye) */
        @media (min-width: 768px) {
            body {
                align-items: center;
                background-color: #000;
            }
            .app-container {
                width: 100%;
                max-width: 480px; /* Mobil ekran boyutuna sabitliyoruz */
                background-color: var(--bg-dark);
                min-height: 100vh;
                box-shadow: 0 0 50px rgba(0,0,0,0.5);
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">Cio<span>TV</span></div>
        <div class="live-badge">CANLI</div>
    </header>

    <main>
        <div class="video-container">
            <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered vjs-fluid" controls preload="auto" autoplay muted playsinline>
            </video>
        </div>

        <div class="info-bar">
            <div class="now-playing-label">Şu An Yayında</div>
            <div id="nowPlayingText">Yükleniyor...</div>
        </div>

        <div class="channels-wrapper">
            <h3>KANALLAR</h3>
            <div class="channel-list" id="channelList">
                </div>
        </div>
    </main>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
    const jsonUrl = "https://raw.githubusercontent.com/akropavic/kacakci/main/stream_links.json";
    const channelList = document.getElementById('channelList');
    const nowPlayingText = document.getElementById('nowPlayingText');
    
    // Video.js Oynatıcıyı Başlat
    const player = videojs('my-video', {
        liveui: true,
        autoplay: 'muted',
        controls: true
    });

    // Kanal ismini temiz gösterme
    function formatChannelName(name) {
        return name.replace('bein', 'BeIN Sports ')
                   .replace('max', 'Max ')
                   .toUpperCase();
    }

    // Veri çekme mantığı
    fetch(jsonUrl)
        .then(response => response.json())
        .then(data => {
            let isFirstChannel = true;

            for (const [channelKey, links] of Object.entries(data)) {
                if (links.length > 0) {
                    const streamUrl = links[0];
                    const displayName = formatChannelName(channelKey);
                    
                    const btn = document.createElement('div');
                    btn.className = 'channel-btn';
                    
                    // İçine isim ve aktiflik noktası koyuyoruz
                    btn.innerHTML = `
                        <span>${displayName}</span>
                        <div class="status-dot"></div>
                    `;
                    
                    btn.onclick = () => {
                        // Diğer butonlardan active class'ını temizle
                        document.querySelectorAll('.channel-btn').forEach(b => {
                            b.classList.remove('active');
                            b.querySelector('.status-dot').style.display = 'none';
                        });
                        
                        // Tıklananı aktif yap
                        btn.classList.add('active');
                        btn.querySelector('.status-dot').style.display = 'block';
                        
                        nowPlayingText.innerText = displayName;
                        playStream(streamUrl);
                        
                        // Tıklayınca yukarı kaydır
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };

                    // Başlangıçta noktaları gizle
                    btn.querySelector('.status-dot').style.display = 'none';
                    
                    channelList.appendChild(btn);

                    // İlk kanalı aç
                    if (isFirstChannel) {
                        btn.classList.add('active');
                        btn.querySelector('.status-dot').style.display = 'block';
                        nowPlayingText.innerText = displayName;
                        playStream(streamUrl);
                        isFirstChannel = false;
                    }
                }
            }
        })
        .catch(error => {
            console.error("Veri hatası:", error);
            nowPlayingText.innerText = "Yayın listesi çekilemedi!";
            nowPlayingText.style.color = "#ef4444";
        });

    function playStream(url) {
        player.src({
            src: url,
            type: 'application/x-mpegURL'
        });
        
        player.ready(function() {
            player.play().catch(e => console.log("Otomatik oynatma bekliyor..."));
        });
    }
</script>

</body>
</html>
