<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CioTV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --surface2: #1f1f1f;
      --border: rgba(255,255,255,0.07);
      --text: #f0f0f0;
      --muted: #6b6b6b;
      --accent: #e8ff5a;
      --accent-dim: rgba(232,255,90,0.12);
      --live: #ff4b4b;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    ::-webkit-scrollbar { display: none; }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      flex-shrink: 0;
      padding: 18px 20px 14px;
      padding-top: calc(18px + env(safe-area-inset-top, 0px));
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: var(--accent);
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,75,75,0.12);
      border: 1px solid rgba(255,75,75,0.25);
      border-radius: 20px;
      padding: 3px 9px;
      margin-left: auto;
    }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .live-pill span {
      font-size: 11px;
      font-weight: 500;
      color: var(--live);
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
    }

    /* ── VIDEO PLAYER ── */
    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .idle-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .idle-msg .idle-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
    }
    .idle-msg .idle-icon svg { opacity: 0.3; }
    .idle-msg p { font-size: 13px; color: var(--muted); }
    .idle-msg.hidden { opacity: 0; }

    /* Controls overlay */
    .controls {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 5;
    }
    .controls.visible { opacity: 1; }

    .ctrl-center { display: flex; align-items: center; gap: 28px; }

    .btn-ctrl {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, background 0.2s;
    }
    .btn-ctrl:active { color: #fff; background: rgba(255,255,255,0.1); }

    .btn-play {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-play:active { transform: scale(0.93); }

    .btn-fs {
      position: absolute;
      bottom: 12px; right: 12px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.8);
      border-radius: 8px;
      padding: 7px;
      cursor: pointer;
      display: flex;
    }

    .ctrl-live {
      position: absolute;
      bottom: 14px; left: 14px;
      display: flex; align-items: center; gap: 5px;
    }
    .ctrl-live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .ctrl-live span {
      font-size: 11px;
      font-weight: 500;
      color: var(--live);
      letter-spacing: 0.5px;
    }

    /* ── NOW PLAYING ── */
    .now-playing {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
      padding-left: 2px;
      min-height: 16px;
    }
    .now-playing b {
      color: var(--accent);
      font-weight: 500;
    }

    /* ── CHANNEL LIST ── */
    .section-label {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .loader {
      display: none;
      margin: 24px auto;
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .ch-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    .ch-card:active { transform: scale(0.97); }
    .ch-card.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .ch-num {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 18px;
    }
    .ch-card.active .ch-num { color: var(--accent); }

    .ch-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-card.active .ch-name { color: var(--accent); }

    /* ── BOTTOM NAV ── */
    nav {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; }
    .tab span { font-size: 11px; font-weight: 500; letter-spacing: 0.3px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">CioTV</div>
    <div class="live-pill">
      <div class="live-dot"></div>
      <span>CANLI</span>
    </div>
  </header>

  <main>
    <!-- Video -->
    <div class="player-wrap" id="player-wrap">
      <video id="video" playsinline></video>

      <div class="idle-msg" id="idle-msg">
        <div class="idle-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </div>
        <p>Bir kanal seç</p>
      </div>

      <div class="controls" id="controls">
        <div class="ctrl-center">
          <button class="btn-ctrl" onclick="seek(-10)" title="Geri">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.93"/>
              <text x="8" y="16" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">10</text>
            </svg>
          </button>
          <button class="btn-play" id="btn-play" onclick="togglePlay()">
            <svg id="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
            <svg id="icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="btn-ctrl" onclick="seek(10)" title="İleri">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3.93"/>
              <text x="8" y="16" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">10</text>
            </svg>
          </button>
        </div>
        <div class="ctrl-live">
          <div class="ctrl-live-dot"></div>
          <span>CANLI</span>
        </div>
        <button class="btn-fs" onclick="toggleFS()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Now playing -->
    <p class="now-playing" id="now-playing">Kanal seçilmedi</p>

    <!-- Channels -->
    <p class="section-label">Kanallar</p>
    <div class="loader" id="loader"></div>
    <div class="channel-grid" id="channel-grid"></div>
  </main>

  <nav>
    <a class="tab active" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
      </svg>
      <span>Canlı</span>
    </a>
  </nav>
</div>

<script>
  const API = 'https://raw.githubusercontent.com/akropavic/kacakci/refs/heads/main/stream_links.json';
  const video = document.getElementById('video');
  const wrap = document.getElementById('player-wrap');
  const controls = document.getElementById('controls');
  const idleMsg = document.getElementById('idle-msg');
  const nowPlaying = document.getElementById('now-playing');
  const grid = document.getElementById('channel-grid');
  const loader = document.getElementById('loader');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');

  let hls = null;
  let activeCard = null;
  let hideTimer = null;

  // Show/hide controls on tap
  wrap.addEventListener('click', () => {
    if (!video.src && !hls) return;
    controls.classList.add('visible');
    resetHideTimer();
  });

  function resetHideTimer() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!video.paused) controls.classList.remove('visible');
    }, 3000);
  }

  function togglePlay() {
    if (video.paused) { video.play(); }
    else { video.pause(); }
  }

  function seek(s) {
    video.currentTime += s;
    resetHideTimer();
  }

  function toggleFS() {
    const el = wrap;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }

  video.addEventListener('play', () => {
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
    resetHideTimer();
  });

  video.addEventListener('pause', () => {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
    controls.classList.add('visible');
    clearTimeout(hideTimer);
  });

  // Load channels
  async function loadChannels() {
    loader.style.display = 'block';
    try {
      const res = await fetch(API);
      const data = await res.json();
      const keys = Object.keys(data);
      keys.forEach((key, i) => {
        const url = data[key][0];
        const name = key.replace(/(\d+)/g, ' $1').trim();

        const card = document.createElement('div');
        card.className = 'ch-card';
        card.innerHTML = `
          <span class="ch-num">${String(i + 1).padStart(2, '0')}</span>
          <span class="ch-name">${name.toUpperCase()}</span>`;
        card.addEventListener('click', () => play(url, name, card));
        grid.appendChild(card);
      });
    } catch (e) {
      nowPlaying.textContent = 'Kanal listesi yüklenemedi.';
    } finally {
      loader.style.display = 'none';
    }
  }

  function play(url, name, card) {
    if (activeCard) activeCard.classList.remove('active');
    card.classList.add('active');
    activeCard = card;

    idleMsg.classList.add('hidden');
    nowPlaying.innerHTML = `Şu an: <b>${name.toUpperCase()}</b>`;
    iconPlay.style.display = 'none';
    iconPause.style.display = '';

    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');

    if (Hls.isSupported()) {
      hls = new Hls({ enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.once(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play();
    }

    controls.classList.add('visible');
    resetHideTimer();
  }

  loadChannels();
</script>
</body>
</html>
